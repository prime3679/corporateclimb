<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Corporate Climb — A Satirical Turn-Based RPG</title>
    <meta
      name="description"
      content="Navigate the absurdity of modern career progression. Built by Adrian Lumley with Claude Code."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Corporate Climb" />
    <meta
      property="og:description"
      content="A satirical turn-based RPG about climbing the corporate ladder. Play free in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://corpclimber.com/" />
    <meta property="og:image" content="https://corpclimber.com/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Corporate Climb" />
    <meta
      name="twitter:description"
      content="A satirical turn-based RPG about climbing the corporate ladder. Play free in your browser."
    />
    <meta name="twitter:image" content="https://corpclimber.com/og.png" />

    <!-- Favicon — tiny ladder in game palette -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><rect x='6' y='2' width='4' height='28' rx='1' fill='%234F46E5'/><rect x='22' y='2' width='4' height='28' rx='1' fill='%234F46E5'/><rect x='6' y='8' width='20' height='3' rx='1' fill='%23818CF8'/><rect x='6' y='16' width='20' height='3' rx='1' fill='%23818CF8'/><rect x='6' y='24' width='20' height='3' rx='1' fill='%23818CF8'/></svg>"
    />

    <!-- PWA: installable, offline-capable -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Night-lobby midtone / Title field floor (--cc-bg): the one boot color.
         Same value as the html/#root void and .boot-splash below,
         capacitor.config.ts, manifest.webmanifest, and BOOT_COLOR in
         src/platform/native.ts (boot-splash.test.ts enforces). -->
    <meta name="theme-color" content="#12141a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Home-screen label. Launchers truncate past ~12 characters, so this is
         the one place the name is shortened; it must match the manifest
         short_name (src/__tests__/app-name.test.ts). Everywhere else the game
         is "Corporate Climb". -->
    <meta name="apple-mobile-web-app-title" content="Corp Climb" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Night-lobby midtone / Title field floor. This is what shows in the
           safe-area bands (under the status bar / home indicator) and in the
           instant before .boot-splash paints, so it must be the boot color,
           not a third shade. */
        background: #12141a;
      }
      body {
        -webkit-touch-callout: none;
      }
      /* Safe area insets for notched devices. The native shell keeps the
         status bar as a transparent overlay (Capacitor StatusBar
         overlaysWebView: true, ios.contentInset: 'never'), so this padding is
         the only inset — nothing else may add one. */
      #root {
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      /* Pre-hydration splash: static markup React replaces on mount, so
         the first paint is branded instead of a blank void. The sprite
         preloader screen mirrors this layout for a seamless handoff, and
         the native splash PNG (resources/splash.png, scripts/gen-splash.mjs)
         mirrors it again one step earlier — change one, regenerate the other. */
      .boot-splash {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #12141a;
      }
      .boot-splash svg {
        width: 76px;
        height: 76px;
        animation: boot-pulse 1.3s ease-in-out infinite;
      }
      .boot-wordmark {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-weight: 800;
        font-size: 19px;
        letter-spacing: 0.3em;
        color: #f2f6fa;
        text-indent: 0.3em; /* visually recenters the tracked-out caps */
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
          <rect x="6" y="2" width="4" height="28" rx="1" fill="#ffc107" />
          <rect x="22" y="2" width="4" height="28" rx="1" fill="#ffc107" />
          <rect x="6" y="8" width="20" height="3" rx="1" fill="#ffd54f" />
          <rect x="6" y="16" width="20" height="3" rx="1" fill="#ffd54f" />
          <rect x="6" y="24" width="20" height="3" rx="1" fill="#ffd54f" />
        </svg>
        <div class="boot-wordmark">CORPORATE CLIMB</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
